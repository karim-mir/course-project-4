{% extends "users/home.html" %}

{% block base_content %}
<h1>
    {% if object %}
        Редактировать сообщение
    {% else %}
        Добавить сообщение
    {% endif %}
</h1>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'mailings:mailings_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
